<!DOCTYPE html>
<html lang="en">
<head>

    <title>Achievements</title>
    <link rel="stylesheet" href="AchievementPage.css">
</head>
<body>

<div class="overlay" id="achievementOverlay">

        <button class="close-btn" onclick="closeOverlay()">X</button>

        </div>
    </div>
</div>

<script src="AchievementPage.js"></script>
</body>
</html>
