<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Achievement</title>
    <link rel="stylesheet" href="badge.css">
</head>
<body>
    <div class="achievement-container">
        <div class="achievement-content">
            <!-- Bird Icon on the Left -->
            <div class="achievement-icon">
                <img src="./images/earlybird.png" alt="Early Bird Icon"> <!-- Replace with the actual path -->
            </div>
            <!-- Text Content on the Right -->
            <div class="achievement-text">
                <div class="achievement-header">
                    <img src="./images/achievement.png" alt="Achievement Icon" class="achievement-top-icon"> <!-- Replace with the actual path -->
                    <h2 class="achievement-title">New Achievement!</h2>
                </div>
                <h1 class="achievement-name">EARLY BIRD</h1>
                <p class="achievement-message">Great job!<br>Being an early learner puts you on the path to success.</p>
            </div>
        </div>
        <div class="buttons">
            <button class="button" id="backHome">Back to Home</button>
            <button class="button" id="nextLesson">Next Lesson</button>
        </div>
    </div>
    <script src="badge.js"></script>
</body>
</html>
