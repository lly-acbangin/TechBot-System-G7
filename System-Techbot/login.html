<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBot Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-container">
            <img src="./images/loginrobot.png" alt="TechBot Logo" class="logo">
            <h1>
                <span class="welcome">WELCOME TO</span><br>
                <span class="techbot">TechBot</span>
                
            </h1>
        </div>
        <div class="right-container">
            <h2>LOGIN</h2>
            <p id="generalError" class="error-message"></p>
            <form id="loginForm">
                <label for="email">*Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
                <p id="emailError" class="error-message"></p>
              
                <label for="StudentNumber">*Student Number</label>
                <input type="text" id="StudentNumber" required placeholder="Enter your Student ID" oninput="validateStudentNumber()">

                <p id="lrnError"></p>

                <label for="password">*Password</label>
                <div class="password-container">
                    <input type="password" id="password" required placeholder="Enter your password">
                    <img src="./images/eyehidden.png" class="toggle-password" onclick="togglePassword('password', this)">
                </div>
                
                <button type="submit" class="login-btn">LOG IN</button>

                <p class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Forgot Password?</a></p>
    
                <p>
                    Don't have an account? <a href="signup.html" style="font-style: italic;">Sign up</a>
                </p>
            </form>

          <!-- Forgot Password Section (Initially Hidden) -->
<div id="forgotPasswordSection" class="hidden">
    <h2>Forgot Password</h2>

    <!-- Step 1: Enter Email -->
    <form id="emailForm">
        <label for="forgotEmail">*Enter Your Email</label>
        <input type="email" id="forgotEmail" required placeholder="Enter your email">
        <button type="submit" class="login-btn">Send OTP</button>
    </form>

    <!-- Step 2: Enter OTP -->
    <form id="otpForm" class="hidden">
        <label for="otp">*Enter OTP</label>
        <input type="text" id="otp" maxlength="6" pattern="\d{6}" required placeholder="Enter OTP">
        <button type="submit" class="login-btn">Verify OTP</button>
    </form>

    <!-- Step 3: Change Password -->
    <form id="passwordForm" class="hidden">
        <label for="newPassword">*New Password</label>
        <div class="password-container">
            <input type="password" id="newPassword" required placeholder="Enter new password">
            <img src="./images/eyehidden.png" class="toggle-password" onclick="togglePassword('newPassword', this)" alt="toggle visibility">
        </div>

        <label for="confirmPassword">*Confirm New Password</label>
        <div class="password-container">
            <input type="password" id="confirmPassword" required placeholder="Confirm new password">
            <img src="./images/eyehidden.png" class="toggle-password" onclick="togglePassword('confirmPassword', this)" alt="toggle visibility">
        </div>

        <button type="submit" class="login-btn">Reset Password</button>
    </form>

    <p id="successMessage" class="hidden" style="color: green; font-weight: bold;">Password reset successfully!</p>
</div>


    <script src="login.js"></script>
</body>
</html>
