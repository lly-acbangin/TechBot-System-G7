<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Details</title>
  <link rel="stylesheet" href="useraccount.css">
</head>

<body>
  <div class="background"></div>

  <div class="account-card">
    <div class="title-row">
      <img src="https://cdn-icons-png.flaticon.com/512/483/483411.png" class="title-icon">
      <h2>Account Details</h2>
    </div>

    <div class="content">
      <div class="left-section">
        <div class="profile-pic"></div>
        <div class="input-group section-group">
          <label>Section</label>
          <input type="text" id="section" value="eg. 2D">
        </div>        
      </div>

      <div class="form-section">
        <div class="row">
          <div class="input-group">
            <label>First Name</label>
            <input type="text" value="Delfin">
          </div>
          <div class="input-group">
            <label>Middle Name</label>
            <input type="text" value="Leal">
          </div>
        </div>

        <div class="row">
          <div class="input-group">
            <label>Surname</label>
            <input type="text" value="Delacruz">
          </div>
          <div class="input-group">
            <label>Student Number</label>
            <input type="text" value="232299">
          </div>
        </div>

        <div class="row">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" value="delacruzdelifin@gmail.com">
          </div>

          <div class="input-group">
            <label>Password</label>
            <div class="password-display">********</div>
            <a href="changepassword.html" class="change-password">Change Password</a>
          </div>          
        </div>
      </div>
    </div>

    <div class="button-group">
      <a href="homepageicon.html">
        <button>Back to Home</button>
    </a>
    <button class="save-btn" onclick="openModal()">Save Changes</button>

    </div>
  </div>

  <div id="saveChangesModal" class="modal">
    <div class="modal-content">
      <h2>Save changes?</h2>
      <p>Your updates will be saved successfully, and you can edit them anytime!</p>
      <div class="modal-buttons">
        <button class="cancels-btn" onclick="closeModal()">Cancel</button>
        <button class="confirm-btn" onclick="showConfirmationModal()">Yes, Save Changes</button>
      </div>

      <div id="confirmationModal" class="modal">
        <div class="modal-content">
          <img src="https://cdn-icons-png.flaticon.com/128/12901/12901762.png" alt="Check Icon">
          <h2>Changes Saved!</h2>
          <p>Your account details have been updated successfully.</p>
          <div class="modal-buttons">
            <button class="confirm-btn" onclick="closeConfirmationModal()">OK</button>
          </div>
        </div>
      </div>      
    </div>
  </div>

  <script src="useraccount.js"></script>
</body>

</html>
